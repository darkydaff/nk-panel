services:
  db:
    image: mysql:8.4
    container_name: nk-panel-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-amnezia_panel}
      MYSQL_USER: ${DB_USERNAME:-amnezia}
      MYSQL_PASSWORD: ${DB_PASSWORD:-amnezia}
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
      - ./my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgdb:
    image: postgres:16-alpine
    container_name: nk-panel-pgdb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${EXT_PG_DB:-nocodb}
      POSTGRES_USER: ${EXT_PG_USER:-nocodb}
      POSTGRES_PASSWORD: ${EXT_PG_PASSWORD:-nocodb}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres_db.sql:/docker-entrypoint-initdb.d/01_postgres_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${EXT_PG_USER:-nocodb} -d $${EXT_PG_DB:-nocodb}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nk-panel-web
    restart: unless-stopped
    sysctls:
      - net.ipv4.ip_nonlocal_bind=1
    depends_on:
      db:
        condition: service_healthy
      pgdb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-amnezia_panel}
      DB_USERNAME: ${DB_USERNAME:-amnezia}
      DB_PASSWORD: ${DB_PASSWORD:-amnezia}
      EXT_PG_HOST: pgdb
      EXT_PG_PORT: 5432
      EXT_PG_DB: ${EXT_PG_DB:-nocodb}
      EXT_PG_USER: ${EXT_PG_USER:-nocodb}
      EXT_PG_PASSWORD: ${EXT_PG_PASSWORD:-nocodb}
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
    ports:
      - "8084:80"

  caddy:
    image: caddy:2-alpine
    container_name: nk-panel-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    command: caddy reverse-proxy --from core.nkhub.one --to web:80

volumes:
  db_data:
  pg_data:
  caddy_data:
  caddy_config:

